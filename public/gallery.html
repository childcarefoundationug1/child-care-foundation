<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery - Child Care Foundation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4fbf6;
    color:#222;
}

header{
    background:#087a42;
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    margin-bottom:10px;
}

header p{
    opacity:.9;
}

.container{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
    cursor:pointer;
    transition:transform 0.25s ease;
}

.card img:hover{
    transform:scale(1.03);
}

.card p{
    padding:12px;
    text-align:center;
}

.loading{
    text-align:center;
    font-size:20px;
    color:#087a42;
    padding:40px;
}
.lightbox{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:rgba(0,0,0,0.9);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.lightbox img{
    max-width:95%;
    max-height:90vh;
    object-fit:contain;
    border-radius:10px;
}

.lightbox-close{
    position:absolute;
    top:20px;
    right:25px;
    color:white;
    font-size:35px;
    font-weight:bold;
    cursor:pointer;
}
</style>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2KZLPFFX6V"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2KZLPFFX6V');
</script>

</head>

<body>

<div id="lightbox" class="lightbox">

    <span
        class="lightbox-close"
        onclick="closeLightbox()"
    >
        &times;
    </span>

    <img
        id="lightboxImage"
        src=""
        alt="Gallery Image"
    >

</div>
<header>

<h1>📷 Child Care Foundation Gallery</h1>

<p>
Moments of hope, care and community.
</p>

</header>

<div class="container">

<div id="gallery" class="gallery">

<div class="loading">
Loading gallery...
</div>

</div>
<script>
const API_URL = "https://child-care-foundation-api-production.up.railway.app";

async function loadGallery() {

    const gallery =
        document.getElementById("gallery");

    gallery.innerHTML =
        '<div class="loading">Loading gallery...</div>';

    try {

        const response =
            await fetch(`${API_URL}/api/gallery`);

        const data =
            await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to load gallery."
            );
        }

        if (data.images.length === 0) {

            gallery.innerHTML = `
                <div class="loading">
                    No gallery images available yet.
                </div>
            `;

            return;
        }

        gallery.innerHTML =
            data.images.map(image => `
                <div class="card">

                    <img
                        src="${API_URL}${image.url}"
                        alt="Child Care Foundation Gallery Image"
                        loading="lazy"
                        onclick="openLightbox('${API_URL}${image.url}')"
                    >

                    <p>Child Care Foundation</p>

                </div>
            `).join("");

    } catch (error) {

        console.error(error);

        gallery.innerHTML = `
            <div class="loading">
                Unable to load gallery.
            </div>
        `;
    }

}
function openLightbox(imageUrl) {

    const lightbox =
        document.getElementById("lightbox");

    const lightboxImage =
        document.getElementById("lightboxImage");

    lightboxImage.src = imageUrl;

    lightbox.style.display = "flex";
}


function closeLightbox() {

    const lightbox =
        document.getElementById("lightbox");

    const lightboxImage =
        document.getElementById("lightboxImage");

    lightbox.style.display = "none";

    lightboxImage.src = "";
}
loadGallery();

</script>

</body>
</html>
